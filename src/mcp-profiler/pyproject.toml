[project]
name = "cdda-mcp-table-profiling"
version = "0.1.0"
description = "CDDA table-profiling MCP server (profile_table, get_schema, sample_rows, profile_columns_light)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0",
    "databricks-sdk>=0.40",
    "requests>=2.28",
]

[project.scripts]
mcp-server = "server.main:main"

[tool.hatch.build.targets.wheel]
packages = ["server", "cdda_tools"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
